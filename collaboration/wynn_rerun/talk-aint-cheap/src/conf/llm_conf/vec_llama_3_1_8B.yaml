# check https://docs.litellm.ai/docs/routing for more details on how to configure multiple endpoints

language_models:
  - model_name: "llama-3.1-8b-chat"
    litellm_params:
      model: "hosted_vllm/llama"
      api_base: "http://wynn-llama:8000/v1" # the actual model endpoint
      timeout: 300
      num_retries: 7
      rpm: 1000

completion_params:
  top_p: 0.9
  max_tokens: 2048
  # etc etc.
